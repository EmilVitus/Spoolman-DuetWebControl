name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Spoolman-0.5.0.zip
            dist/spoolman-bridge-server-0.5.0.zip
