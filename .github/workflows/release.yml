name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Create GitHub release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Spoolman-0.5.0.zip
            dist/spoolman-bridge-server-0.5.0.zip
      - name: Create draft release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Manual build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: |
            dist/Spoolman-0.5.0.zip
            dist/spoolman-bridge-server-0.5.0.zip
