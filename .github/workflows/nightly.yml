name: Nightly Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Prepare nightly asset names
        run: |
          cp dist/Spoolman-0.5.0.zip dist/Spoolman-nightly.zip
          cp dist/spoolman-bridge-server-0.5.0.zip dist/spoolman-bridge-server-nightly.zip
      - name: Publish or update Nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Spoolman Nightly Builds
          draft: false
          prerelease: true
          make_latest: false
          body: |
            What is a Nightly Build?
            Nightly builds are the latest versions of Spoolman DuetWebControl, automatically compiled after every new commit to the main branch.
            This means each build includes the most recent changes and improvements.
            While these builds provide early access to development progress, they may contain bugs or unstable features.

            Install latest nightly bridge server:
            curl -fsSL https://raw.githubusercontent.com/EmilVitus/Spoolman-DuetWebControl/main/scripts/install-bridge-nightly.sh | sudo bash
          files: |
            dist/Spoolman-nightly.zip
            dist/spoolman-bridge-server-nightly.zip
            scripts/install-bridge-nightly.sh
